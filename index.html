:root{--bg:#0B0A10;--s1:#16141F;--s2:#1F1C2B;--line:#262136;--av:#2B2440;--tx:#F2EEFF;--mu:#A39BB8;--lil:#C4B2FF;--lil2:#E4DBFF;--pos:#7EE0B5;--neg:#FF8A7A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050408;color:var(--tx);font-family:Manrope,system-ui,-apple-system,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center}
button{font-family:inherit;color:inherit;cursor:pointer}
.orb{font-family:Orbitron,Manrope,sans-serif}
.phone{position:relative;width:393px;height:852px;background:var(--bg);border-radius:52px;overflow:hidden;box-shadow:0 0 0 10px #1a1724,0 0 0 11px #2d2840,0 30px 80px rgba(0,0,0,.6)}
@media (max-width:520px){body{display:block}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}}
.scroll{position:absolute;inset:0 0 84px 0;overflow-y:auto;padding:60px 20px 28px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
@media (max-width:520px){.scroll{padding-top:calc(env(safe-area-inset-top) + 20px)}}
.scroll::-webkit-scrollbar{display:none}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.mu{color:var(--mu)}
h1{margin:0;font-size:28px;font-weight:800}
.av{flex:none;border-radius:50%;background:var(--av);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--lil2)}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px}
.seg{display:grid;gap:4px;background:var(--s1);border-radius:16px;padding:4px}
.seg button{min-height:42px;border:0;border-radius:12px;font-weight:700;font-size:14px;background:transparent}
.seg button.on{background:var(--lil);color:var(--bg)}
.cta{min-height:54px;border:0;border-radius:18px;font-weight:800;font-size:16px;width:100%;display:flex;align-items:center;justify-content:center}
.back{width:44px;height:44px;border-radius:22px;background:var(--s1);border:0;display:flex;align-items:center;justify-content:center}
.quote{background:var(--s2);border-radius:14px;padding:11px 12px;font-size:13px;line-height:1.4}
.lbl{font-size:13px;color:var(--mu);font-weight:700}
nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--bg);border-top:1px solid #221D31;display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px}
@media (max-width:520px){nav{height:calc(70px + env(safe-area-inset-bottom))}.scroll{bottom:calc(70px + env(safe-area-inset-bottom))}}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#8F87A6;background:none;border:0;width:64px;min-height:44px;padding:0}
.tab.on{color:var(--lil)}
.fab{width:56px;height:56px;border-radius:28px;background:var(--lil);color:var(--bg);border:0;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 0 28px rgba(142,107,255,.55)}
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--lil);color:var(--bg);font-weight:800;font-size:13px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
input{min-height:52px;border-radius:16px;border:1px solid var(--av);background:var(--s1);color:var(--tx);font:600 15px Manrope,sans-serif;padding:0 16px;outline:none;width:100%}
input::placeholder{color:#7D7594}
.fade{animation:f .22s ease}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<body>
<div class="phone" id="app"></div>
<script>
const I={
home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v2a3 3 0 0 0 3 3M16 6h3v2a3 3 0 0 1-3 3M12 13v4M8 20h8"/>',
feed:'<path d="M5 6h14M5 12h14M5 18h9"/>',
user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"/><path d="M10 20a2 2 0 0 0 4 0"/>',
back:'<path d="M15 6l-6 6 6 6"/>',chev:'<path d="M9 6l6 6-6 6"/>',
band:'<rect x="7" y="4" width="10" height="16" rx="3"/><path d="M10 9h4M10 12h4"/>',
scale:'<path d="M12 3v18M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/>',
info:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>'};
const ic=(n,sz=24,c='currentColor')=>`<svg aria-hidden="true" width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const star=(sz,c)=>`<svg aria-hidden="true" width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="${c}"><path d="M12 1c.7 5.6 3.4 8.3 11 11-7.6 2.7-10.3 5.4-11 11-.7-5.6-3.4-8.3-11-11 7.6-2.7 10.3-5.4 11-11z"/></svg>`;

const S={screen:'home',synced:false,qtab:'daily',done:{steps:false,gym:true,sleep:true,phone:false,read:false,cold:false},
rtab:'friends',mode:'give',friend:'Masha',amt:1,reason:'',sent:false,appealed:false,votes:{},react:{},show:'aura',taker:'friends'};

function home(){
 const items=[['Steps','8 432','+500',84,0,'1 568 left to 10 000'],['Workout','45 min','+300',100,1,'counted'],['Sleep','7 h 40 m','+150',100,1,'in bed before midnight'],['Phone-free','1 h 10 m','+200',58,0,'goal 2 hours']];
 return `<div class="row" style="justify-content:space-between">
 <div class="row" style="gap:6px"><span class="orb" style="font-weight:900;font-style:italic;font-size:22px;letter-spacing:2px;color:var(--lil)">AURA</span>${star(14,'#E4DBFF')}</div>
 <div class="row" style="gap:10px"><button class="back" data-go="court" aria-label="Notifications" style="position:relative">${ic('bell',22)}<span style="position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:5px;background:var(--neg)"></span></button>
 <button class="av" data-go="profile" aria-label="Profile" style="width:44px;height:44px;border:0">A</button></div></div>
 <div class="card" style="border-radius:28px;padding:22px;gap:14px">
 <div class="row" style="justify-content:space-between"><span class="mu" style="font-size:14px;font-weight:600">Your aura</span><span class="pill" style="background:var(--lil);color:var(--bg)">Level: Sigma</span></div>
 <div class="orb" style="font-weight:900;font-size:64px;line-height:1;color:var(--lil2);text-shadow:0 0 32px rgba(142,107,255,.6)">6767</div>
 <div style="font-size:14px;color:var(--pos);font-weight:700">+1 250 this week</div>
 <div><div class="bar"><i style="width:68%;background:var(--lil)"></i></div><div class="row mu" style="justify-content:space-between;font-size:12px;margin-top:6px"><span>Sigma</span><span>3 233 to Gigachad</span></div></div></div>
 <div class="row" style="background:var(--s1);border-radius:20px;padding:12px 14px">
 <div style="width:40px;height:40px;border-radius:12px;background:#221D31;display:flex;align-items:center;justify-content:center;color:var(--lil)">${ic('band',22)}</div>
 <div style="flex:1;display:flex;flex-direction:column;gap:2px"><b style="font-size:14px">${S.synced?'Bracelet updated':'Bracelet connected'}</b><span class="mu" style="font-size:12px">${S.synced?'Just now · showing 6767':'Last sync 12 min ago'}</span></div>
 <button data-act="sync" style="min-height:44px;border:0;border-radius:14px;background:var(--av);color:var(--lil2);font-weight:700;font-size:13px;padding:0 14px">Sync</button></div>
 <button data-go="court" class="row" style="text-align:left;background:#2A1A22;border:1px solid #4A2A33;border-radius:20px;padding:14px">${ic('scale',22,'#FF8A7A')}<span style="flex:1;font-size:13px;line-height:1.35">Dima took <b style="color:var(--neg)">−500</b> from you. Appeal in Aura Court</span>${ic('chev',18,'#A39BB8')}</button>
 <div class="row" style="justify-content:space-between;margin-top:4px"><b style="font-size:18px">Today</b><button data-go="quests" style="background:none;border:0;color:var(--lil);font-weight:700;font-size:13px">All quests</button></div>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${items.map(([l,v,r,p,d,h])=>{const c=d?'#7EE0B5':'#C4B2FF';return `<div style="background:var(--s1);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px">
 <div class="row" style="justify-content:space-between"><span class="mu" style="font-size:13px;font-weight:600">${l}</span><span class="pill" style="padding:3px 8px;background:${d?'#173A2C':'#221D31'};color:${c}">${r}</span></div>
 <b style="font-size:22px">${v}</b><div class="bar" style="height:6px"><i style="width:${p}%;background:${c}"></i></div><span class="mu" style="font-size:11px">${h}</span></div>`}).join('')}</div>`;
}

function quests(){
 const q=[['steps','10 000 steps','8 432 of 10 000','+500'],['gym','Workout 30+ min','from Apple Health','+300'],['sleep','In bed before midnight','from sleep data','+150'],['phone','2 hours phone-free','from Screen Time','+200'],['read','Read 20 pages','post a page photo to the feed','+150'],['cold','Cold shower','post a 10 sec video','+250']];
 const duels=[['Most steps this week','ends Sunday','1 000','Masha',72,'48 210',81,'53 940'],['Longest without social media','ends Friday','500','Dima',64,'6 h 20 m',38,'3 h 45 m']];
 let body;
 if(S.qtab==='daily') body=q.map(([id,t,s,r])=>{const d=S.done[id],c=d?'#7EE0B5':'#C4B2FF';return `<button data-act="quest" data-id="${id}" class="row" style="width:100%;text-align:left;background:var(--s1);border:1px solid #221D31;border-radius:20px;padding:14px">
 <span style="width:26px;height:26px;flex:none;border-radius:13px;border:2px solid ${c};background:${d?c:'transparent'};display:flex;align-items:center;justify-content:center;color:var(--bg);font-weight:900">${d?'✓':''}</span>
 <span style="flex:1;display:flex;flex-direction:column;gap:3px"><b style="font-size:15px">${t}</b><span class="mu" style="font-size:12px">${s}</span></span><b style="color:${c};font-size:14px">${r}</b></button>`}).join('');
 else body=duels.map(([t,u,st,rv,m,mv,th,tv])=>`<div class="card"><div class="row" style="justify-content:space-between"><span class="mu" style="font-size:12px;font-weight:600">${u}</span><span class="pill" style="background:var(--lil);color:var(--bg)">Stake ${st}</span></div><b style="font-size:16px">${t}</b>
 <div class="row" style="gap:10px"><b style="width:52px;font-size:13px">You</b><div class="bar" style="flex:1;height:10px"><i style="width:${m}%;background:var(--lil)"></i></div><b style="width:66px;text-align:right;font-size:13px">${mv}</b></div>
 <div class="row mu" style="gap:10px"><b style="width:52px;font-size:13px">${rv}</b><div class="bar" style="flex:1;height:10px"><i style="width:${th}%;background:#6E6487"></i></div><b style="width:66px;text-align:right;font-size:13px">${tv}</b></div></div>`).join('')+
 `<button class="cta" data-go="rating" style="background:var(--lil);color:var(--bg)">Challenge a friend</button><span class="mu" style="font-size:12px;text-align:center">Winner takes the other side’s stake. Both players confirm it.</span>`;
 return `<div class="row" style="gap:8px"><button class="back" data-go="home" aria-label="Back">${ic('back',20)}</button><h1>Quests</h1></div>
 <div class="row card" style="flex-direction:row;padding:16px;gap:14px"><span class="orb" style="font-weight:900;font-size:34px;color:var(--lil)">12</span><span style="display:flex;flex-direction:column;gap:2px"><b>Aura streak</b><span class="mu" style="font-size:12px">days in a row with a quest done. Day 14 gives x2 aura</span></span></div>
 <div class="row" style="gap:8px">${[['daily','Today'],['duels','Duels']].map(([id,l])=>`<button data-act="qtab" data-id="${id}" style="min-height:40px;border:0;border-radius:999px;padding:0 18px;font-weight:700;font-size:14px;background:${S.qtab===id?'var(--lil)':'var(--s1)'};color:${S.qtab===id?'var(--bg)':'var(--tx)'}">${l}</button>`).join('')}</div>
 <div style="display:flex;flex-direction:column;gap:10px">${body}</div>`;
}

function rating(){
 const D={friends:[['1','Masha','9 120','Gigachad'],['2','Liza','8 004','Sigma'],['3','You','6 767','Sigma',1],['4','Dima','5 310','Vibe Check'],['5','Artem','4 980','Vibe Check'],['6','Sasha','3 400','NPC'],['7','Kirill','2 150','NPC']],
 russia:[['1','sigma_spb','184 200','Aura Lord'],['2','nonchalant.msk','171 950','Aura Lord'],['3','kazan_vibe','160 310','Aura Lord'],['4','lizzz','155 004','Gigachad'],['5','tima_ekb','149 880','Gigachad'],['6','polina.run','141 200','Gigachad'],['12 408','You','6 767','Sigma',1]],
 world:[['1','aura.tokyo','402 100','Aura Lord'],['2','mewing_king','388 450','Aura Lord'],['3','sigma_spb','184 200','Aura Lord'],['4','berlin.walks','179 300','Aura Lord'],['5','nonchalant.msk','171 950','Aura Lord'],['6','seoul.gym','166 020','Aura Lord'],['210 554','You','6 767','Sigma',1]]};
 const L=D[S.rtab],ini=n=>n.replace(/[^A-Za-z]/g,'')[0].toUpperCase(),rings=['#E4DBFF','#C4B2FF','#A88BFF'],hs=[118,88,70];
 const pod=[1,0,2].map(i=>{const p=L[i];return `<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div class="av" style="width:56px;height:56px;font-size:20px;border:2px solid ${rings[i]}">${ini(p[1])}</div><b style="font-size:13px;text-align:center;word-break:break-all">${p[1]}</b>
 <div style="width:100%;height:${hs[i]}px;border-radius:16px 16px 6px 6px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="orb" style="font-weight:900;font-size:22px;color:${rings[i]}">${p[0]}</span><span class="mu" style="font-size:12px;font-weight:700">${p[2]}</span></div></div>`}).join('');
 const rows=L.slice(3).map(([r,n,s,l,me])=>`<div class="row" style="border-radius:18px;padding:12px 14px;background:${me?'#221A3A':'var(--s1)'};border:1px solid ${me?'#8E6BFF':'#221D31'}"><span class="orb mu" style="width:56px;font-weight:700;font-size:12px">#${r}</span><span class="av" style="width:36px;height:36px">${ini(n)}</span><span style="flex:1;min-width:0;display:flex;flex-direction:column"><b style="font-size:14px">${n}</b><span class="mu" style="font-size:11px">${l}</span></span><b class="orb" style="font-size:14px;color:${me?'var(--lil)':'var(--tx)'}">${s}</b></div>`).join('');
 return `<div class="row" style="justify-content:space-between"><h1>Leaderboard</h1><span class="mu" style="font-size:12px;font-weight:600">resets Monday</span></div>
 <div class="seg" style="grid-template-columns:repeat(3,1fr)">${[['friends','Friends'],['russia','Russia'],['world','World']].map(([id,l])=>`<button data-act="rtab" data-id="${id}" class="${S.rtab===id?'on':''}">${l}</button>`).join('')}</div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin-top:8px">${pod}</div>
 <div style="display:flex;flex-direction:column;gap:8px">${rows}</div>
 ${S.rtab==='friends'?`<button class="cta" data-go="give" style="background:var(--s1);border:1px dashed #4A4064;color:var(--lil);font-size:14px">Give or take aura from a friend</button>`:''}`;
}

function give(){
 const g=S.mode==='give',acc=g?'#7EE0B5':'#FF8A7A',vals=g?[100,500,1000]:[100,300,500],amt=vals[S.amt];
 if(S.sent) return `<div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:110px" class="fade">${star(88,acc)}
 <div class="orb" style="font-weight:900;font-size:48px;color:${acc}">${g?'+':'−'}${amt}</div><b style="font-size:18px">${g?'Sent to ':'Taken from '}${S.friend}</b>
 <span class="mu" style="font-size:14px;line-height:1.45;max-width:290px">${g?S.friend+' will see it in the feed. Their bracelet updates on next sync.':S.friend+' has 24 hours to appeal to Aura Court. If the court disagrees, the aura goes back.'}</span>
 <button class="cta" data-act="reset" style="background:var(--s1);margin-top:24px">Done</button><button data-go="feed" style="background:none;border:0;color:var(--lil);font-weight:700;font-size:14px;min-height:44px">See it in the feed</button></div>`;
 return `<div class="row" style="justify-content:space-between"><h1>Aura transfer</h1><span class="mu" style="font-size:12px;font-weight:600">${g?'2 000 left today':'1 take left today'}</span></div>
 <div class="seg" style="grid-template-columns:1fr 1fr"><button data-act="mode" data-id="give" style="font-size:15px;font-weight:800;${g?'background:#7EE0B5;color:var(--bg)':''}">+ Give</button><button data-act="mode" data-id="take" style="font-size:15px;font-weight:800;${g?'':'background:#FF8A7A;color:var(--bg)'}">− Take</button></div>
 <span class="lbl">Who</span><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:-6px">${['Masha','Dima','Liza','Artem'].map(n=>`<button data-act="friend" data-id="${n}" style="display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font-weight:700;font-size:12px"><span class="av" style="width:56px;height:56px;font-size:20px;border:2px solid ${S.friend===n?acc:'var(--av)'}">${n[0]}</span>${n}</button>`).join('')}</div>
 <span class="lbl">How much</span><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-6px">${vals.map((v,i)=>`<button data-act="amt" data-id="${i}" class="orb" style="min-height:56px;border-radius:16px;border:1px solid ${S.amt===i?acc:'var(--av)'};background:${S.amt===i?acc:'var(--s1)'};color:${S.amt===i?'var(--bg)':'var(--tx)'};font-weight:900;font-size:18px">${g?'+':'−'}${v}</button>`).join('')}</div>
 <label class="lbl" for="reason">Reason (required)</label><input id="reason" style="margin-top:-6px" value="${S.reason.replace(/"/g,'&quot;')}" placeholder="${g?'e.g. saved me at the econometrics exam':'e.g. 40 minutes late to the movies'}">
 <div class="row" style="align-items:flex-start;gap:10px;background:${g?'#12241D':'#2A1A22'};border-radius:16px;padding:14px">${ic('info',20,acc)}<span style="font-size:12px;line-height:1.45;color:#D8D1EA">${g?'Giving is free, but you have a daily budget of 3 000. You can give the same person aura once per day.':'You can take up to 500 from one friend once per day. An AI filter blocks insults. Your friend can appeal to Aura Court, where mutual friends vote.'}</span></div>
 <button class="cta" id="cta" data-act="send"></button>`;
}
function paintCta(){const b=document.getElementById('cta');if(!b)return;const g=S.mode==='give',acc=g?'#7EE0B5':'#FF8A7A',amt=(g?[100,500,1000]:[100,300,500])[S.amt],ok=S.reason.trim().length>2;
 b.style.background=ok?acc:'#221D31';b.style.color=ok?'#0B0A10':'#7D7594';b.textContent=ok?(g?`Give ${amt} to ${S.friend}`:`Take ${amt} from ${S.friend}`):'Write a reason first';}

function court(){
 const cases=[['a','Artem','Sasha','−300','spoiled the season finale','it was already on TikTok'],['b','Liza','Kirill','−500','forgot my birthday','I was abroad with no internet']];
 return `<div class="row" style="gap:8px"><button class="back" data-go="home" aria-label="Back">${ic('back',20)}</button><h1>Aura Court</h1></div>
 <span class="mu" style="font-size:13px;line-height:1.45">Disputed takes are judged by 5 mutual friends. Majority wins. If the take was unfair, the aura goes back with a +100 bonus.</span>
 <span class="lbl" style="margin-top:4px">YOUR CASE</span>
 <div class="card" style="border-color:#4A2A33"><div class="row" style="gap:10px"><span class="av" style="width:40px;height:40px">D</span><span style="flex:1;font-size:14px"><b>Dima</b> took <b style="color:var(--neg)">−500</b> from you</span><span class="mu" style="font-size:12px">18 h left</span></div>
 <div class="quote"><span class="mu">Reason:</span> 40 minutes late to the movies</div>
 ${S.appealed?`<div class="quote fade"><span class="mu">Your appeal:</span> traffic jam on the ring road, screenshot of the map attached</div>
 <div class="row" style="justify-content:space-between;font-size:12px;font-weight:700"><span style="color:var(--pos)">Unfair 3</span><span class="mu">2 of 5 still voting</span><span style="color:var(--neg)">Fair 0</span></div><div class="bar"><i style="width:60%;background:var(--pos)"></i></div>`
 :`<button class="cta" data-act="appeal" style="background:var(--neg);color:var(--bg);min-height:48px;font-size:15px">Appeal: it was a traffic jam</button>`}</div>
 <span class="lbl" style="margin-top:4px">YOU ARE A JUROR</span>
 ${cases.map(([id,f,t,a,r,ap])=>{const v=S.votes[id];return `<div class="card"><span style="font-size:14px"><b>${f}</b> took <b style="color:var(--neg)">${a}</b> from <b>${t}</b></span>
 <div class="quote" style="display:flex;flex-direction:column;gap:6px"><span><span class="mu">Reason:</span> ${r}</span><span><span class="mu">Appeal:</span> ${ap}</span></div>
 ${v?`<b class="fade" style="font-size:13px;color:var(--lil)">You voted: ${v}. +20 aura for jury duty</b>`:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button data-act="vote" data-id="${id}" data-v="fair" style="min-height:46px;border:1px solid #4A2A33;border-radius:14px;background:#2A1A22;color:var(--neg);font-weight:800">Fair take</button><button data-act="vote" data-id="${id}" data-v="unfair" style="min-height:46px;border:1px solid #1F4A38;border-radius:14px;background:#12241D;color:var(--pos);font-weight:800">Unfair</button></div>`}</div>`}).join('')}
 <div class="card" style="border:0"><b>How we keep it fair</b><span class="mu" style="font-size:12px;line-height:1.5">AI filter blocks insults and personal data in reasons. Max one take per friend per day, up to 500. Lose 3 court cases in a row and you cannot take aura for 7 days. Jurors are random mutual friends, never the two people involved.</span></div>`;
}

function feed(){
 const P=[[1,'M','Masha gave Liza aura','+1000','saved me at the econometrics exam','12 min ago',14,0],[2,'A','Artem hit 10 000 steps','+500','','40 min ago',6,1],[3,'D','Dima took aura from you','−500','40 minutes late to the movies','2 h ago',3,9,1],[4,'S','Sasha reached level Sigma','6000','','5 h ago',21,2],[5,'L','Liza won a step duel against Artem','+1000','','yesterday',11,4]];
 return `<div class="row" style="justify-content:space-between"><h1>Feed</h1><span class="mu" style="font-size:12px;font-weight:600">friends only</span></div>`+
 P.map(([id,i,t,a,q,tm,b,c,disp])=>{const m=S.react[id],col=a[0]==='−'?'var(--neg)':a[0]==='+'?'var(--pos)':'var(--lil)';
 return `<div class="card" style="border-color:#221D31;padding:16px"><div class="row" style="align-items:flex-start"><span class="av" style="width:40px;height:40px">${i}</span><span style="flex:1;display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;line-height:1.4">${t}</span><span class="mu" style="font-size:12px">${tm}</span></span><b class="orb" style="font-size:16px;color:${col}">${a}</b></div>
 ${q?`<div class="quote" style="color:#D8D1EA">“${q}”</div>`:''}${disp?`<button data-go="court" style="background:none;border:0;padding:0;text-align:left;color:var(--neg);font-weight:700;font-size:13px">Disputed in Aura Court</button>`:''}
 <div class="row" style="gap:8px">${[['b','based',b],['c','cringe',c]].map(([k,l,n])=>`<button data-act="react" data-id="${id}" data-v="${k}" style="min-height:36px;border-radius:999px;padding:0 14px;font-weight:700;font-size:13px;border:1px solid ${m===k?(k==='b'?'var(--lil)':'var(--neg)'):'var(--av)'};background:${m===k?(k==='b'?'var(--av)':'#2A1A22'):'transparent'}">${l} · ${n+(m===k?1:0)}</button>`).join('')}</div></div>`}).join('');
}

function profile(){
 const shows=[['aura','Aura','6767'],['level','Level','SIGMA'],['rank','Rank','#3']],tk=[['close','Close friends'],['friends','All friends'],['none','Nobody']],days=[['M',120],['T',260],['W',90],['T',180],['F',210],['S',300],['S',90]];
 const opt=(on)=>`border:1px solid ${on?'var(--lil)':'var(--av)'};background:${on?'var(--lil)':'transparent'};color:${on?'var(--bg)':'var(--tx)'}`;
 return `<div class="row" style="gap:14px"><span class="av" style="width:72px;height:72px;font-size:28px;border:2px solid var(--lil)">A</span><span style="display:flex;flex-direction:column;gap:3px"><b style="font-size:22px">Alina</b><span class="mu" style="font-size:13px">@alina.aura · Sigma · #3 among friends</span></span></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[['6 767','aura','var(--lil)'],['12','day streak',''],['4–1','duels won','']].map(([v,l,c])=>`<div style="background:var(--s1);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px"><b class="orb" style="font-size:18px;color:${c||'var(--tx)'}">${v}</b><span class="mu" style="font-size:11px">${l}</span></div>`).join('')}</div>
 <div class="card"><div class="row"><div class="orb" style="width:64px;height:32px;border-radius:10px;background:var(--bg);border:1px solid #3A3150;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--lil)">${shows.find(s=>s[0]===S.show)[2]}</div><span style="flex:1;display:flex;flex-direction:column;gap:2px"><b>Aura Counter</b><span style="font-size:12px;color:var(--pos)">Connected · battery 82%</span></span></div>
 <span class="lbl">Show on bracelet</span><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${shows.map(([id,l])=>`<button data-act="show" data-id="${id}" style="min-height:44px;border-radius:12px;font-weight:700;font-size:13px;${opt(S.show===id)}">${l}</button>`).join('')}</div></div>
 <div class="card" style="border:0"><div class="row" style="justify-content:space-between"><b>This week</b><b style="color:var(--pos);font-size:13px">+1 250</b></div>
 <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px">${days.map(([d,v],i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:100%;height:${Math.round(v/300*86)}px;border-radius:8px;background:${i===5?'var(--lil)':'#3A3150'}"></div><span class="mu" style="font-size:11px;font-weight:600">${d}</span></div>`).join('')}</div></div>
 <b>Badges</b><div class="row" style="flex-wrap:wrap;gap:8px;margin-top:-6px">${['10k club','Nonchalant','Fair juror'].map(b=>`<span class="pill" style="padding:8px 12px;background:#221D31;color:var(--lil2)">${b}</span>`).join('')}<span class="pill" style="padding:8px 12px;color:#7D7594;border:1px dashed #3A3150">Gigachad · locked</span></div>
 <div class="card" style="border:0"><b>Who can take my aura</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${tk.map(([id,l])=>`<button data-act="taker" data-id="${id}" style="min-height:44px;border-radius:12px;font-weight:700;font-size:12px;${opt(S.taker===id)}">${l}</button>`).join('')}</div>
 <span class="mu" style="font-size:12px;line-height:1.45">Strangers can never take aura. Global ranks count only steps, workouts and quests.</span></div>`;
}

const SCREENS={home,quests,rating,give,court,feed,profile};
function nav(){const t=(id,ico,l,on)=>`<button class="tab ${on?'on':''}" data-go="${id}">${ic(ico)}${l}</button>`,s=S.screen;
 return `<nav>${t('home','home','Home',s==='home'||s==='quests'||s==='court')}${t('rating','trophy','Ranks',s==='rating')}<button class="fab" data-go="give" aria-label="Give or take aura">${star(26,'currentColor')}</button>${t('feed','feed','Feed',s==='feed')}${t('profile','user','Profile',s==='profile')}</nav>`;}
let lastScreen=null;
function render(){const app=document.getElementById('app');const keep=lastScreen===S.screen?(app.querySelector('.scroll')||{}).scrollTop||0:0;
 app.innerHTML=`<div class="scroll ${lastScreen!==S.screen?'fade':''}">${SCREENS[S.screen]()}</div>${nav()}<div class="toast" id="toast"></div>`;
 app.querySelector('.scroll').scrollTop=keep;lastScreen=S.screen;paintCta();}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}
const A={
 sync:()=>{S.synced=true;render();toast('Bracelet synced')},
 quest:id=>{S.done[id]=!S.done[id];render()},qtab:id=>{S.qtab=id;render()},rtab:id=>{S.rtab=id;render()},
 mode:id=>{S.mode=id;S.amt=1;render()},friend:id=>{S.friend=id;render()},amt:id=>{S.amt=+id;render()},
 send:()=>{if(S.reason.trim().length>2){S.sent=true;render()}else{document.getElementById('reason').focus();toast('Add a reason first')}},
 reset:()=>{S.sent=false;S.reason='';render()},appeal:()=>{S.appealed=true;render()},
 vote:(id,v)=>{S.votes[id]=v;render()},react:(id,v)=>{S.react[id]=S.react[id]===v?null:v;render()},
 show:id=>{S.show=id;render()},taker:id=>{S.taker=id;render()}};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){S.screen=g.dataset.go;if(S.screen==='give')S.sent=false;render();return}
 const a=e.target.closest('[data-act]');if(a)A[a.dataset.act](a.dataset.id,a.dataset.v);});
document.addEventListener('input',e=>{if(e.target.id==='reason'){S.reason=e.target.value;paintCta()}});
render();
</script>
</body>
</html>
